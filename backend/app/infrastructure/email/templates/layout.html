<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#fbf8fa;font-family:Arial,Helvetica,sans-serif;color:#22161e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbf8fa;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                 style="max-width:560px;width:100%;background:#ffffff;border:1px solid #eadfe6;border-radius:12px;overflow:hidden;">
            <tr>
              <td dir="{{ dir }}" style="background:#a4116a;color:#ffffff;padding:20px 28px;font-size:18px;font-weight:bold;text-align:{{ align }};">
                {{ brand }}
              </td>
            </tr>
            <tr>
              <td dir="{{ dir }}" style="padding:28px;text-align:{{ align }};font-size:15px;line-height:1.6;">
                <p style="margin:0 0 16px;">{{ greeting }} {{ name }}{{ comma }}</p>
                <p style="margin:0 0 24px;">{{ body }}</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ link }}"
                     style="display:inline-block;background:#a4116a;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:bold;">
                    {{ button }}
                  </a>
                </p>
                <p style="margin:0 0 8px;color:#6e5d68;font-size:13px;">{{ note }}</p>
                <p dir="ltr" style="margin:0;color:#6e5d68;font-size:12px;word-break:break-all;text-align:{{ align }};">{{ link }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
