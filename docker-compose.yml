name: cift

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cift}
      POSTGRES_DB: ${POSTGRES_DB:-cift}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cift} -d ${POSTGRES_DB:-cift}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cift}:${POSTGRES_PASSWORD:-cift}@db:5432/${POSTGRES_DB:-cift}
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db

volumes:
  pgdata: